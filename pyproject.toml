[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-cylinder-common"
version = "0.1.10"
description = "Canonical Smart Cylinder system modules for Edge and Web consumers"
requires-python = ">=3.11"
dependencies = ["Flask>=3.1,<4", "supabase>=2.10,<3", "paho-mqtt>=2.1,<3", "numpy>=2.1,<3", "scipy>=1.14,<2"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["system", "system.*"]
namespaces = true

